# =============================================================================
# Intent Engine - All-in-One Production Container
# =============================================================================
# This compose file runs the entire Intent Engine stack in a SINGLE container
# Services included:
#   - PostgreSQL 15 (Database)
#   - Redis/Valkey (Cache)
#   - SearXNG (Privacy search)
#   - Intent Engine API (FastAPI)
#   - Nginx (Reverse proxy)
#
# Ports exposed:
#   - 80: Main API (via nginx)
#   - 5432: PostgreSQL (optional, for external access)
#   - 8080: Direct SearXNG access (optional)
# =============================================================================

services:
  intent-engine-aio:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.aio
    container_name: intent-engine-aio
    ports:
      # Main API endpoint
      - "80:80"
      # PostgreSQL (optional - comment out in production if not needed externally)
      - "5432:5432"
      # SearXNG direct access (optional)
      - "8080:8080"
      # Qdrant (optional - requires ENABLE_QDRANT=true)
      - "6333:6333"
      # Go Search API (optional - requires ENABLE_GO_SERVICES=true)
      - "8081:8081"
      # Go Unified Search API (optional - requires ENABLE_GO_SERVICES=true)
      - "8082:8082"
      # Prometheus metrics (optional)
      - "9090:9090"
    environment:
      # Application
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - WORKERS=2
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - RELOAD=false
      - DEBUG=false
      
      # Database
      - DATABASE_USER=intent_user
      - DATABASE_PASSWORD=intent_secure_p_ssw0rd_2026_prod
      - DATABASE_NAME=intent_engine
      - DATABASE_HOST=127.0.0.1
      - DATABASE_PORT=5432
      
      # For PostgreSQL container internal use
      - POSTGRES_USER=intent_user
      - POSTGRES_PASSWORD=intent_secure_p_ssw0rd_2026_prod
      - POSTGRES_DB=intent_engine
      - PGDATA=/var/lib/postgresql/data
      
      # Redis
      - REDIS_ENABLED=true
      - REDIS_URL=redis://127.0.0.1:6379/0
      
      # SearXNG
      - SEARXNG_BASE_URL=http://127.0.0.1:8080
      - SEARXNG_SECRET_KEY=a3f8b2c1d4e5f6789012345678901234567890abcdef1234567890abcdef1234
      
      # Qdrant (optional)
      - ENABLE_QDRANT=true
      - QDRANT_HOST=127.0.0.1
      - QDRANT_PORT=6333
      
      # Go Services (optional) - Requires additional database configuration
      - ENABLE_GO_SERVICES=true
      # Go Search API Database Configuration (overrides hardcoded "crawler" user)
      - GO_SEARCH_DB_USER=${GO_SEARCH_DB_USER:-intent_user}
      - GO_SEARCH_DB_PASSWORD=${GO_SEARCH_DB_PASSWORD:-intent_secure_p_ssw0rd_2026_prod}
      - GO_SEARCH_DB_HOST=127.0.0.1
      - GO_SEARCH_DB_PORT=5432
      - GO_SEARCH_DB_NAME=${POSTGRES_DB:-intent_engine}
      # Go Search API URL for Python API
      - GO_SEARCH_API_URL=http://127.0.0.1:8081
      - GO_CRAWLER_URL=http://127.0.0.1:8081
      # DATABASE_URL for Go Crawler (full connection string)
      - DATABASE_URL=postgresql://intent_user:intent_secure_p_ssw0rd_2026_prod@127.0.0.1:5432/intent_engine?sslmode=disable
      # Unified Search Configuration
      - SEARXNG_URL=http://127.0.0.1:8080
      - QDRANT_ADDR=127.0.0.1:6333
      - INTENT_ENGINE_API_URL=http://127.0.0.1:8000
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=3600
      - PARALLEL_SEARCH=true
      
      # Security
      - SECRET_KEY=secure_random_key_for_production_2026_test_suite
      - ENABLE_CORS=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080,https://yourdomain.com
      - CORS_ALLOW_CREDENTIALS=true
      
      # Rate Limiting
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_DEFAULT=100/minute
      - RATE_LIMIT_STRICT=20/minute
      - RATE_LIMIT_STORAGE_URL=redis://127.0.0.1:6379/0
      
      # Database Pool
      - DATABASE_POOL_SIZE=10
      - DATABASE_MAX_OVERFLOW=20
      - DATABASE_POOL_TIMEOUT=30
      - DATABASE_POOL_RECYCLE=1800
      
      # Redis Pool
      - REDIS_MAX_CONNECTIONS=50
      - REDIS_TIMEOUT=5.0
      
      # ML Models
      - MODEL_CACHE_DIR=/app/data/models
      - TRANSFORMERS_CACHE=/app/data/transformers
      - SENTENCE_TRANSFORMERS_DEVICE=cpu
      
      # Privacy & Compliance
      - ENABLE_ANONYMIZATION=true
      - ANONYMIZATION_SALT=secure_salt_for_anonymization_2026_prod
      - CONSENT_REQUIRED=true
      - SESSION_DATA_RETENTION_HOURS=8
      
      # Monitoring
      - ENABLE_METRICS=true
      - HEALTH_CHECK_INTERVAL=30
      - HEALTH_CHECK_TIMEOUT=10
    volumes:
      # Persistent data
      - intent-aio-postgres:/var/lib/postgresql/data
      - intent-aio-redis:/app/data/redis
      - intent-aio-searxng:/app/data/searxng
      - intent-aio-qdrant:/qdrant/storage
      # Application data
      - intent-aio-app-data:/app/data
      # Logs
      - intent-aio-logs:/var/log/nginx
      # Optional: Mount searxng config (must be rw for entrypoint to modify)
      - ../../app/searxng:/etc/searxng:rw
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
        reservations:
          cpus: '4.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/live"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    stop_grace_period: 60s
    stop_signal: SIGTERM

# Named volumes for data persistence
volumes:
  intent-aio-postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../../data/postgres
  intent-aio-redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../../data/redis
  intent-aio-searxng:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../../data/searxng
  intent-aio-qdrant:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../../data/qdrant
  intent-aio-app-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../../data/app
  intent-aio-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../../data/logs
