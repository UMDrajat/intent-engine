name: Auto Version Bump

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [main, master]
  workflow_dispatch:

jobs:
  auto-version:
    name: Auto Version & Tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Commitizen
        run: pip install commitizen

      - name: Get last tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          # Remove 'v' prefix if present for comparison
          LAST_TAG_CLEAN=$(echo "$LAST_TAG" | sed 's/^v//')
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "last_tag_clean=$LAST_TAG_CLEAN" >> $GITHUB_OUTPUT
          echo "Last tag: $LAST_TAG (clean: $LAST_TAG_CLEAN)"

      - name: Analyze commits since last tag
        id: commits
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.last_tag }}"

          if [ -z "$LAST_TAG" ]; then
            echo "No tags found, checking all commits"
            COMMITS=$(git log --pretty=format:"%s" --reverse)
          else
            echo "Checking commits since $LAST_TAG"
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"%s" --reverse)
          fi

          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Determine bump type
          BUMP_TYPE="skip"
          HAS_BREAKING=false

          while IFS= read -r commit; do
            # Check for breaking changes
            if echo "$commit" | grep -qE "(BREAKING CHANGE|^[a-z]+!:)"; then
              HAS_BREAKING=true
              BUMP_TYPE="major"
              break
            fi

            # Check for features (minor bump)
            if echo "$commit" | grep -qE "^feat(\(.+\))?:|^feat:"; then
              if [ "$BUMP_TYPE" != "major" ]; then
                BUMP_TYPE="minor"
              fi
            fi

            # Check for fixes/perf (patch bump)
            if echo "$commit" | grep -qE "^(fix|perf)(\(.+\))?:|^(fix|perf):"; then
              if [ "$BUMP_TYPE" == "skip" ]; then
                BUMP_TYPE="patch"
              fi
            fi
          done <<< "$COMMITS"

          # Default to patch if no conventional commits found but there are changes
          if [ "$BUMP_TYPE" == "skip" ] && [ -n "$COMMITS" ]; then
            echo "No conventional commits detected, defaulting to patch"
            BUMP_TYPE="patch"
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Determined bump type: $BUMP_TYPE"

      - name: Skip if no version bump needed
        if: steps.commits.outputs.bump_type == 'skip'
        run: |
          echo "No commits or no changes since last tag, skipping version bump"
          exit 0

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Check if version bump is needed
        id: version_check
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.last_tag }}"
          LAST_TAG_CLEAN="${{ steps.last_tag.outputs.last_tag_clean }}"

          # Get current version from pyproject.toml
          CURRENT_VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "Current version in pyproject.toml: $CURRENT_VERSION"
          echo "Last tag: $LAST_TAG (clean: $LAST_TAG_CLEAN)"

          # If last tag exists and is different from current version, check if current is older
          # Use sort -V to compare semver versions
          if [ -n "$LAST_TAG_CLEAN" ] && [ "$LAST_TAG_CLEAN" != "$CURRENT_VERSION" ]; then
            OLDER_VERSION=$(printf "$CURRENT_VERSION\n$LAST_TAG_CLEAN" | sort -V | head -n1)
            if [ "$OLDER_VERSION" == "$CURRENT_VERSION" ]; then
              echo "⚠️ Version mismatch detected (Current $CURRENT_VERSION < Tag $LAST_TAG_CLEAN)!"
              echo "Updating version-sensitive files to $LAST_TAG_CLEAN"
              sed -i "s/^version = \".*\"/version = \"$LAST_TAG_CLEAN\"/" pyproject.toml
              sed -i "s/__version__ = \".*\"/__version__ = \"$LAST_TAG_CLEAN\"/" __version__.py
              sed -i "s/__version__ = \".*\"/__version__ = \"$LAST_TAG_CLEAN\"/" __init__.py
              sed -i "s/version-.*-blue/version-$LAST_TAG_CLEAN-blue/" README.md
              sed -i "s/Latest Release: v.*/Latest Release: v$LAST_TAG_CLEAN/" README.md

              git add pyproject.toml __version__.py __init__.py README.md
              git commit -m "chore: sync version with last tag $LAST_TAG_CLEAN [skip ci]" || true
              CURRENT_VERSION="$LAST_TAG_CLEAN"
              else
              echo "ℹ️ pyproject.toml version ($CURRENT_VERSION) is already ahead of last tag ($LAST_TAG_CLEAN)."
              fi
              fi
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check if commits since last tag warrant a version bump
          if [ -n "$LAST_TAG" ]; then
            COMMITS_SINCE_TAG=$(git log $LAST_TAG..HEAD --pretty=format:"%s" | wc -l)
            echo "Commits since last tag: $COMMITS_SINCE_TAG"

            if [ "$COMMITS_SINCE_TAG" -eq 0 ]; then
              echo "No new commits since last tag, skipping version bump"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Skip if no version bump needed
        if: steps.version_check.outputs.skip == 'true' || steps.commits.outputs.bump_type == 'skip'
        run: |
          echo "No version bump needed, skipping"
          exit 0

      - name: Bump version with Commitizen
        id: bump
        if: steps.version_check.outputs.skip != 'true' && steps.commits.outputs.bump_type != 'skip'
        run: |
          BUMP_TYPE="${{ steps.commits.outputs.bump_type }}"
          CURRENT_VERSION="${{ steps.version_check.outputs.current_version }}"

          echo "Bumping version: $CURRENT_VERSION with $BUMP_TYPE increment"

          # Check if expected new version tag already exists on remote
          # We do this to determine if we should "force" or if it's already released
          # But for now, let's just run cz bump
          
          # Run commitizen bump
          # Note: cz bump will update pyproject.toml and create a commit/tag
          if cz bump --increment $BUMP_TYPE --yes --changelog-to-stdout > /tmp/changelog_entry.txt; then
            echo "Commitizen bump successful"
            MANUAL_BUMP=false
          else
            echo "Commitizen bump failed, trying manual update"
            MANUAL_BUMP=true
            
            # Fallback: manually update version
            MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
            MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
            PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
            
            if [ "$BUMP_TYPE" == "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$BUMP_TYPE" == "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
            sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_VERSION\"/" __version__.py
            echo "Manually bumped to $NEW_VERSION"
          fi

          # Get new version from pyproject.toml
          NEW_VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "Version is now: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Check if tag exists (either from previous runs or created by cz bump)
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "tag_exists_locally=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists_locally=false" >> $GITHUB_OUTPUT
          fi

      - name: Push version changes
        if: steps.bump.outputs.new_version != ''
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          
          # Ensure all changes are staged
          git add -A
          
          # Only commit if there are changes (manual bump or cz bump without commit)
          if ! git diff --cached --exit-code > /tmp/git_diff_exit_code; then
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          else
            echo "No changes to commit (already committed by commitizen)"
          fi

          # Handle tag: if it exists, delete and recreate to be safe, 
          # or if it doesn't exist (manual bump), create it
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "⚠️ Tag v$NEW_VERSION already exists locally, recreating..."
            git tag -d "v$NEW_VERSION"
          fi
          
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          
          # Push changes to master/main
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push origin HEAD:$CURRENT_BRANCH --force-with-lease
          
          # Push tag (force to overwrite remote tag if it exists)
          git push origin "v$NEW_VERSION" --force
          
          echo "✓ Pushed version v$NEW_VERSION and tag"

      - name: Create GitHub Release
        if: steps.bump.outputs.new_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: Release v${{ steps.bump.outputs.new_version }}
          body_path: /tmp/changelog_entry.txt
          draft: false
          prerelease: ${{ contains(steps.bump.outputs.new_version, 'alpha') || contains(steps.bump.outputs.new_version, 'beta') || contains(steps.bump.outputs.new_version, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Auto-Version Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Last tag: ${{ steps.last_tag.outputs.last_tag }}"
          echo "- Bump type: ${{ steps.commits.outputs.bump_type }}"
          echo "- New version: v${{ steps.bump.outputs.new_version }}"
          echo "- Success: ${{ steps.bump.outputs.new_version != '' }}"

